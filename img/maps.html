
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa - Império MD Beauty Lounge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script>
        // Inicializar o mapa
        function initMap() {
            // Coordenadas do salão: Rua Antônio Fabris, 800, Canoas, RS
            const location = {
                lat: -29.9051,
                lng: -51.2187
            };
            
            // Criar o mapa
            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 16,
                center: location,
                mapTypeId: 'roadmap'
            });
            
            // Adicionar marcador
            const marker = new google.maps.Marker({
                position: location,
                map: map,
                title: 'Império MD Beauty Lounge'
            });
            
            // Info window
            const infoWindow = new google.maps.InfoWindow({
                content: `
                    <div style="padding: 8px; font-size: 13px; color: #333;">
                        <strong>Império MD Beauty Lounge</strong><br>
                        Rua Antônio Fabris, 800<br>
                        Mato Grande, Canoas / RS<br>
                        92323-270<br>
                        <br>
                        <a href="https://wa.me/5551991817667" target="_blank" style="color: #25D366; text-decoration: none;">
                            <strong>Agendar via WhatsApp</strong>
                        </a>
                    </div>
                `
            });
            
            marker.addListener('click', () => {
                infoWindow.open(map, marker);
            });
            
            // Abrir info window automaticamente
            infoWindow.open(map, marker);
        }
        
        // Carregar Google Maps API quando a página carregar
        function loadGoogleMapsAPI() {
            const script = document.createElement('script');
            script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyCfpqUEfPt_3RfEGLz0PkY-6wT7tJnUKmE&callback=initMap';
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }
        
        // Chamar quando o documento estiver pronto
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadGoogleMapsAPI);
        } else {
            loadGoogleMapsAPI();
        }
    </script>
</body>
</html>
